upstream frappe-bench-frappe {
	server 127.0.0.1:8000 fail_timeout=0;
}

upstream frappe-bench-socketio-server {
	server 127.0.0.1:9000 fail_timeout=0;
}



# setup maps


# server blocks




server {
	
	listen 80;
	listen [::]:80;
	

	server_name
		HRP.localhost
		;

	root /home/macro/Frappe/frappe-bench/sites;

	

	proxy_buffer_size 128k;
	proxy_buffers 4 256k;
	proxy_busy_buffers_size 256k;

	

	add_header X-Frame-Options "SAMEORIGIN";
	add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";
	add_header X-Content-Type-Options nosniff;
	add_header X-XSS-Protection "1; mode=block";
	add_header Referrer-Policy "same-origin, strict-origin-when-cross-origin";

	location /assets {
		try_files $uri =404;
		add_header Cache-Control "max-age=31536000";
	}

	location ~ ^/protected/(.*) {
		internal;
		try_files /HRP.localhost/$1 =404;
	}

	location /socket.io {
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header X-Frappe-Site-Name HRP.localhost;
		proxy_set_header Origin $scheme://$http_host;
		proxy_set_header Host $host;

	
		proxy_pass http://frappe-bench-socketio-server;
	}
	location/api/{
					add_header 'Access-Control-Allow-Origin''*';
			add_header 'Access-Control-Allow-Credentials''true' always;
			add_header 'Access-Control-Allow-Methods''GET , POST, OPTIONS' always;
	}

	location / {

 		rewrite ^(.+)/$ $1 permanent;
  		rewrite ^(.+)/index\.html$ $1 permanent;
  		rewrite ^(.+)\.html$ $1 permanent;
        add_header Access-Control-Allow-Origin $cors_origin;
		add_header Access-Control-Allow-Methods "GET,OPTIONS";
		# add_header Set-Cookie "sessionId=abc123;Path=/;HttpOnly;SameSite=None"


		location ~* ^/files/.*.(htm|html|svg|xml) {
			add_header Content-disposition "attachment";
		add_header Access-Control-Allow-Origin $cors_origin;
		add_header Access-Control-Allow-Methods "GET,OPTIONS";


		try_files /HRP.localhost/public/$uri @webserver;
		}
        
		try_files /HRP.localhost/public/$uri @webserver;
	}

	location @webserver {


		if($request_method='OPTIONS'){
			add_header 'Access-Control-Allow-Origin''*';
			add_header 'Access-Control-Allow-Credentials''true';
			add_header 'Access-Control-Allow-Methods''GET , POST, OPTIONS';
			add_header 'Access-Control-Allow-Headers' 'Authorization,DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';
			add_header 'Access-Control-Max-Age''1728000';
			add_header 'Content-Type''text/plain charset=UTF-8';
			add_header 'Content-length''0';
			return 204


		}
		if($request_method='POST'){
			add_header 'Access-Control-Allow-Origin''*';
			add_header 'Access-Control-Allow-Credentials''true';
			add_header 'Access-Control-Allow-Methods''GET,POST,OPTIONS';
			add_header 'Access-Control-Allow-Headers' 'Authorization,DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';
		

		}
			if($request_method='GET'){
			add_header 'Access-Control-Allow-Origin''*';
			add_header 'Access-Control-Allow-Credentials''true';
			add_header 'Access-Control-Allow-Methods''GET,POST,OPTIONS';
			add_header 'Access-Control-Allow-Headers''Authorization,DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';
		

		}




		proxy_http_version 1.1;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Frappe-Site-Name HRP.localhost;
		proxy_set_header Host $host;
		proxy_set_header X-Use-X-Accel-Redirect True;
		proxy_read_timeout 120;
		proxy_redirect off;

		proxy_pass  http://frappe-bench-frappe;
	}

	# error pages
	error_page 502 /502.html;
	location /502.html {
		root /usr/local/lib/python3.10/dist-packages/bench/config/templates;
		internal;
	}

	access_log  /var/log/nginx/access.log main;
	error_log  /var/log/nginx/error.log;

	# optimizations
	sendfile on;
	keepalive_timeout 15;
	client_max_body_size 50m;
	client_body_buffer_size 16K;
	client_header_buffer_size 1k;

	# enable gzip compresion
	# based on https://mattstauffer.co/blog/enabling-gzip-on-nginx-servers-including-laravel-forge
	gzip on;
	gzip_http_version 1.1;
	gzip_comp_level 5;
	gzip_min_length 256;
	gzip_proxied any;
	gzip_vary on;
	gzip_types
		application/atom+xml
		application/javascript
		application/json
		application/rss+xml
		application/vnd.ms-fontobject
		application/x-font-ttf
		application/font-woff
		application/x-web-app-manifest+json
		application/xhtml+xml
		application/xml
		font/opentype
		image/svg+xml
		image/x-icon
		text/css
		text/plain
		text/x-component
		;
		# text/html is always compressed by HttpGzipModule
}


